terms:
  - id: current_charges
    label: Текущие начисления
    definition: В расчёте приложения это сумма строк услуг и отдельно указанных перерасчётов за рассматриваемую квитанцию.
    source_ids: []
    content_version: "1.0"
  - id: total_due
    label: К оплате
    definition: В приложении напечатанная сумма к оплате хранится отдельно от рассчитанного итога и не заменяется им.
    source_ids: []
    content_version: "1.0"
