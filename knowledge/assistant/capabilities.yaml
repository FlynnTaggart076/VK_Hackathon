# Functions the DeepSeek router may choose. Every button it proposes must point to one of them;
# the server validates function names and parameter values before anything runs.
version: 1
services:
  cold_water: Холодная вода
  hot_water: Горячая вода
  heating: Отопление
  electricity: Электричество
  sewerage: Водоотведение
  gas: Газ
  waste: Вывоз мусора (ТКО)
  management: Управляющая компания
functions:
  - id: supplier_contacts
    title: Контакты поставщика услуги
    when: Кто поставляет услугу в дом, телефон или сайт поставщика, кому звонить по конкретной услуге.
    params: {service: optional}
    examples: ["кто поставляет свет", "телефон водоканала", "кому звонить по отоплению"]
  - id: management_contacts
    title: Контакты управляющей компании
    when: Какая у дома управляющая компания, её телефон или почта, кто обслуживает дом.
    params: {}
    examples: ["какая у нас УК", "телефон управляющей компании", "кто обслуживает мой дом"]
  - id: meter_readings
    title: Куда передать показания
    when: Где и как передать показания счётчиков.
    params: {service: optional}
    examples: ["куда передавать показания воды", "как сдать показания за свет"]
  - id: meter_deadline
    title: Срок передачи показаний
    when: До какого числа передавать показания.
    params: {service: optional}
    examples: ["до какого числа сдавать показания"]
  - id: service_issue
    title: Авария или нет услуги
    when: Нет воды, света или отопления, протечка, холодные батареи, куда сообщить об аварии.
    params: {service: optional}
    examples: ["нет горячей воды", "течёт с потолка", "холодные батареи"]
  - id: bill_rise
    title: Почему выросла сумма
    when: Личная квитанция стала больше или меньше, что изменилось по сравнению с прошлым месяцем.
    params: {service: optional}
    examples: ["почему счёт вырос", "в этом месяце заплатил больше", "откуда такая сумма за воду"]
  - id: city_comparison
    title: Сравнить с городом
    when: Сравнить свои начисления со средними по городу или у соседей.
    params: {service: optional}
    examples: ["у соседей так же", "сколько платят в среднем по городу"]
  - id: receipt_upload
    title: Загрузить или разобрать квитанцию
    when: Разобрать платёжку, загрузить квитанцию, распознать документ, объяснить строки своей квитанции.
    params: {}
    examples: ["хочу разобрать платёжку", "как загрузить квитанцию"]
  - id: receipt_history
    title: Мои квитанции
    when: Открыть загруженные квитанции, удалить документ.
    params: {}
    examples: ["где мои квитанции", "удалить квитанцию"]
  - id: compare_receipts
    title: Сравнить две квитанции
    when: Подробно сравнить две свои квитанции по строкам.
    params: {}
    examples: ["сравнить июнь и июль"]
  - id: prepare_draft
    title: Подготовить обращение
    when: Составить текст запроса расшифровки начисления или вопроса в управляющую компанию.
    params: {}
    examples: ["помоги написать запрос в УК", "как попросить расшифровку начисления"]
  - id: faq
    title: Справочная тема
    when: Короткий вопрос о понятиях квитанции с ответом из проверенной базы знаний.
    params: {topic: required}
    topics:
      first_bill: Первая квитанция — что проверить
      bill_terms: Термины и строки квитанции
      account_number: Где найти лицевой счёт
      payment_history: Где посмотреть учтённую оплату
      arrears_or_credit: Долг или переплата
      adjustment: Что такое перерасчёт
      request_breakdown: Как запросить расшифровку начисления
      housing_document: Справки и жилищные документы
      new_resident: С чего начать после переезда
    examples: ["что такое перерасчёт", "где найти лицевой счёт", "что делать после переезда"]
  - id: menu
    title: Главное меню
    when: Пользователь не знает, что спросить, или просит показать возможности.
    params: {}
    examples: ["что ты умеешь", "покажи меню"]
