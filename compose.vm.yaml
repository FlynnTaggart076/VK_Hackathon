services:
  migrate:
    environment: &production_settings
      APP_MODE: production
      ENGINE_MODE: real
      DEMO_AUTH_ENABLED: "false"
      DEMO_ACCESS_CODE: ""
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:?set MAX_BOT_TOKEN in private runtime/app.env}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:?set MAX_WEBHOOK_SECRET in private runtime/app.env}
      MAX_WEB_APP: ${MAX_WEB_APP:?set MAX_WEB_APP in private runtime/app.env}
  api:
    environment: *production_settings
    networks:
      private: {}
      model_egress: {}
  worker:
    environment: *production_settings
    networks:
      private: {}
      max_egress: {}
  web:
    networks:
      private: {}
      edge:
        aliases: [vk-zhkh-web]

networks:
  model_egress: {}
  max_egress: {}
  edge:
    external: true
    name: vk-zhkh-edge
