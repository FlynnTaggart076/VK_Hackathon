map $http_x_forwarded_proto $app_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

limit_req_zone $binary_remote_addr zone=preview_auth:1m rate=12r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    location = /api/v1/auth/preview {
        limit_req zone=preview_auth burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $app_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /team/zhkh-preview { return 308 /team/zhkh-preview/; }
    location ^~ /team/zhkh-preview/ {
        rewrite ^/team/zhkh-preview/(.*)$ /$1 last;
    }

    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $app_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 95s;
    }
    location ^~ /integrations/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $app_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }
    location ^~ /health/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $app_forwarded_proto;
    }
    location ^~ /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
