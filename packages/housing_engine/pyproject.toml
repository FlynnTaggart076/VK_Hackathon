[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "housing-engine"
version = "0.1.0"
description = "DTO contract for the MAX housing assistant"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
contract = ["jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
where = ["src"]
